server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;

    server_name api.pawsome-elements.com;

    # Load the certificate files.
    ssl_certificate         /etc/letsencrypt/live/api.pawsome-elements.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/api.pawsome-elements.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.pawsome-elements.com/chain.pem;

    # Load the Diffie-Hellman parameter.
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        include includes/cors.conf;
        proxy_pass http://pwsm-eu-central-1:8080/;
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 7d;
    }

    location = /healthcheck/ {
        include includes/cors.conf;
        proxy_pass http://pwsm-eu-central-1:8080/healthcheck/;
    }
}
