name: Manual Release

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (e.g., owl, capybara, zebra, pawsome-elements)'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - prod
        default: 'prod'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/infrastructure
            docker compose -f docker-compose.prod.yaml pull ${{ github.event.inputs.service }}
            docker compose -f docker-compose.prod.yaml up -d ${{ github.event.inputs.service }}
            docker compose -f docker-compose.prod.yaml ps ${{ github.event.inputs.service }}
