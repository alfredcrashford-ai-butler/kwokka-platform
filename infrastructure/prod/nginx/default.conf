upstream owl_backend {
    server owl:8080;
}

upstream owl_subauth_backend {
    server owl-subauth:8080;
}

upstream capybara_backend {
    server capybara:8080;
}

upstream zebra_backend {
    server zebra:8080;
}

server {
    listen 80;
    server_name kwokka.co;

    location /healthcheck {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Auth service routes
    location /auth/ {
        include /etc/nginx/includes/cors.conf;
        proxy_pass http://owl_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Sub-auth service routes
    location /subauth/ {
        include /etc/nginx/includes/cors.conf;
        proxy_pass http://owl_subauth_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Profile service routes
    location /profile/ {
        include /etc/nginx/includes/cors.conf;
        proxy_pass http://capybara_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Game service routes
    location /game/ {
        include /etc/nginx/includes/cors.conf;
        proxy_pass http://zebra_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default location
    location / {
        include /etc/nginx/includes/cors.conf;
        proxy_pass http://owl_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
